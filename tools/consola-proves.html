<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <title>Ona Bages Play — consola de proves del motor</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #121417; color: #e6e6e6; }
    header { padding: 12px 16px; background: #1c1f24; border-bottom: 1px solid #333; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { font-size: 16px; margin: 0 16px 0 0; }
    label { font-size: 13px; color: #aaa; }
    input, textarea, button { font: inherit; background: #23272e; color: #e6e6e6; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; }
    button { cursor: pointer; }
    button:hover { border-color: #888; }
    .status { padding: 4px 10px; border-radius: 4px; font-weight: 600; }
    .off { background: #5a1e1e; }
    .on { background: #1f6b43; }
    main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px; height: calc(100vh - 90px); box-sizing: border-box; }
    .side { display: flex; flex-direction: column; gap: 8px; }
    .quick { display: flex; flex-wrap: wrap; gap: 6px; }
    textarea { width: 100%; height: 180px; font-family: Consolas, monospace; font-size: 13px; box-sizing: border-box; }
    #log { background: #0b0c0e; border: 1px solid #333; border-radius: 4px; padding: 8px; overflow: auto; font-family: Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; }
    .out { color: #8ab4ff; }
    .in { color: #9be39b; }
    .ev { color: #888; }
    .err { color: #ff7b7b; }
    select { font: inherit; background: #23272e; color: #e6e6e6; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; max-width: 100%; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > input, .row > select { flex: 1; min-width: 0; }
    #players-status { font-family: Consolas, monospace; font-size: 13px; background: #0b0c0e; border: 1px solid #333; border-radius: 4px; padding: 6px 8px; white-space: pre; }
  </style>
</head>
<body>
  <header>
    <h1>Consola de proves del motor</h1>
    <label>Port <input id="port" value="47800" size="6"></label>
    <label>Testimoni <input id="token" size="52" placeholder="el que mostra la consola del motor"></label>
    <button id="connect">Connectar</button>
    <button id="disconnect">Desconnectar</button>
    <span id="status" class="status off">✖ Desconnectat</span>
  </header>

  <main>
    <div class="side">
      <strong>Ordres ràpides</strong>
      <div class="quick">
        <button data-cmd="engine.hello">engine.hello</button>
        <button data-cmd="engine.ping">engine.ping</button>
        <button data-cmd="state.get">state.get</button>
        <button data-cmd="engine.shutdown">engine.shutdown</button>
      </div>

      <strong>Dispositius</strong>
      <div class="quick">
        <button data-cmd="devices.list">devices.list (actius)</button>
        <button data-cmd="devices.list" data-params='{ "includeInactive": true }'>devices.list (tots)</button>
      </div>

      <strong>Reproductors</strong>
      <div class="row">
        <label>Reproductor</label>
        <select id="pl-id"><option>1</option><option>2</option></select>
      </div>
      <div class="row">
        <select id="pl-device" title="Sortida"><option value="">(connecta't per veure les sortides)</option></select>
        <button id="pl-refresh" title="Tornar a llegir les sortides">↻</button>
        <button id="pl-setdevice">Assignar</button>
      </div>
      <div class="row">
        <input id="pl-path" placeholder="Ruta del fitxer, p. ex. D:\Musica\prova.mp3">
        <button id="pl-load">Carregar</button>
      </div>
      <div class="quick">
        <button data-player-cmd="player.play">▶ Play</button>
        <button data-player-cmd="player.pause">⏸ Pausa</button>
        <button data-player-cmd="player.stop">⏹ Stop</button>
        <button data-player-cmd="player.retry" title="Després d'un error: torna a obrir la sortida i continua des del mateix punt">↻ Reintentar</button>
      </div>
      <div id="players-status">(sense dades)</div>

      <strong>Missatge lliure (JSON)</strong>
      <textarea id="custom">{ "v": 1, "id": 100, "cmd": "engine.hello" }</textarea>
      <button id="send">Enviar</button>

      <label><input type="checkbox" id="hide-status" checked> Amagar els esdeveniments engine.status</label>
      <label><input type="checkbox" id="hide-position" checked> Amagar els esdeveniments player.position</label>
      <button id="clear">Netejar el registre</button>
    </div>

    <div id="log"></div>
  </main>

  <script>
    // Consola independent: obre aquest fitxer al navegador amb el motor en marxa.
    // Arrenca el motor amb: dotnet run --project engine/OnaBages.Engine
    // i copia aquí el testimoni que mostra.

    let socket = null;
    let nextId = 1;
    const $ = (id) => document.getElementById(id);

    function log(text, cls) {
      const line = document.createElement('div');
      line.className = cls;
      line.textContent = `${new Date().toLocaleTimeString('ca-ES', { hour12: false })}  ${text}`;
      $('log').appendChild(line);
      $('log').scrollTop = $('log').scrollHeight;
    }

    function setConnected(on) {
      $('status').className = `status ${on ? 'on' : 'off'}`;
      $('status').textContent = on ? '✔ Connectat' : '✖ Desconnectat';
    }

    $('connect').onclick = () => {
      socket?.close();
      const url = `ws://127.0.0.1:${$('port').value}/ws?token=${encodeURIComponent($('token').value.trim())}`;
      socket = new WebSocket(url);
      socket.onopen = () => {
        setConnected(true);
        log('Connectat', 'in');
        sendCmd('devices.list', { kind: 'output' }); // omple la llista de sortides
        sendCmd('state.get');                        // estat inicial dels reproductors
      };
      socket.onclose = (e) => { setConnected(false); log(`Desconnectat (codi ${e.code})`, 'err'); };
      socket.onerror = () => log('Error de connexió (testimoni incorrecte o motor aturat?)', 'err');
      socket.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { log(`← ${e.data}`, 'err'); return; }
        updatePlayers(msg);
        if (msg.result?.devices) fillDevices(msg.result.devices);
        if (msg.ev === 'engine.status' && $('hide-status').checked) return;
        if (msg.ev === 'player.position' && $('hide-position').checked) return;
        log(`← ${JSON.stringify(msg)}`, msg.ev ? 'ev' : (msg.ok ? 'in' : 'err'));
      };
    };

    $('disconnect').onclick = () => socket?.close();

    function send(text) {
      if (!socket || socket.readyState !== WebSocket.OPEN) { log('No hi ha connexió', 'err'); return; }
      socket.send(text);
      log(`→ ${text}`, 'out');
    }

    document.querySelectorAll('[data-cmd]').forEach((btn) => {
      // data-params (opcional): paràmetres addicionals de l'ordre, en JSON.
      const params = btn.dataset.params ? JSON.parse(btn.dataset.params) : {};
      btn.onclick = () => send(JSON.stringify({ v: 1, id: nextId++, cmd: btn.dataset.cmd, ...params }));
    });

    $('send').onclick = () => send($('custom').value.trim());

    function sendCmd(cmd, params = {}) {
      send(JSON.stringify({ v: 1, id: nextId++, cmd, ...params }));
    }

    // --- Reproductors ---

    const players = {}; // id -> { state, file, position, duration, error }

    function fillDevices(devices) {
      const select = $('pl-device');
      const previous = select.value;
      select.innerHTML = '';
      for (const d of devices.filter((d) => d.kind === 'output')) {
        const option = document.createElement('option');
        option.value = d.id;
        option.textContent = d.name + (d.status === 'active' ? '' : ` (${d.status})`);
        select.appendChild(option);
      }
      if (previous) select.value = previous;
    }

    function updatePlayers(msg) {
      const list = msg.ev === 'player.position' ? msg.players
        : msg.ev === 'player.state' ? [msg.player]
        : msg.result?.players ?? (msg.result?.player ? [msg.result.player] : null);
      if (!list) return;
      for (const p of list) players[p.id] = { ...players[p.id], ...p };
      renderPlayers();
    }

    const time = (s) => {
      if (s == null) return '--:--.-';
      const m = Math.floor(s / 60);
      return `${String(m).padStart(2, '0')}:${(s - m * 60).toFixed(1).padStart(4, '0')}`;
    };

    function renderPlayers() {
      $('players-status').textContent = Object.keys(players).sort().map((id) => {
        const p = players[id];
        const file = p.file ? p.file.split('\\').pop() : '—';
        const line = `${id}: ${String(p.state ?? '?').padEnd(8)} ${time(p.position)} / ${time(p.duration)}  ${file}`;
        return p.state === 'error' ? `${line}\n   ⚠ ${p.error}` : line;
      }).join('\n');
    }

    const playerId = () => $('pl-id').value;
    $('pl-refresh').onclick = () => sendCmd('devices.list', { kind: 'output' });
    $('pl-setdevice').onclick = () => sendCmd('player.setDevice', { player: playerId(), deviceId: $('pl-device').value });
    $('pl-load').onclick = () => sendCmd('player.load', { player: playerId(), path: $('pl-path').value.trim().replace(/^"|"$/g, '') });
    document.querySelectorAll('[data-player-cmd]').forEach((btn) => {
      btn.onclick = () => sendCmd(btn.dataset.playerCmd, { player: playerId() });
    });
    $('clear').onclick = () => { $('log').textContent = ''; };
  </script>
</body>
</html>
