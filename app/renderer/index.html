<!doctype html>
<html lang="ca" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src ws://127.0.0.1:*">
  <title>Ona Bages Play</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="brand"><i class="bi bi-broadcast-pin"></i> Ona Bages Play</div>

    <div id="clock" class="clock" aria-label="Hora actual">--:--:--</div>

    <div class="engine">
      <span id="engine-status" class="status status-connecting" role="status">
        <i class="bi bi-hourglass-split"></i>
        <span class="label">Connectant amb el motor…</span>
      </span>
      <span id="engine-details" class="details"></span>
      <button id="btn-retry" class="btn btn-sm btn-warning d-none" type="button">
        <i class="bi bi-arrow-repeat"></i> Reiniciar el motor
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="panel players" aria-label="Reproductors">
      <div class="player card">
        <div class="card-header"><i class="bi bi-music-note-list"></i> Reproductor 1</div>
        <div class="card-body placeholder-text">Disponible a la fase 2</div>
      </div>
      <div class="player card">
        <div class="card-header"><i class="bi bi-music-note-list"></i> Reproductor 2</div>
        <div class="card-body placeholder-text">Disponible a la fase 2</div>
      </div>
      <div class="player card">
        <div class="card-header"><i class="bi bi-music-note-list"></i> Reproductor 3</div>
        <div class="card-body placeholder-text">Disponible a la fase 2</div>
      </div>
    </section>

    <section class="panel cue card" aria-label="Preescolta">
      <div class="card-header"><i class="bi bi-headphones"></i> Preescolta</div>
      <div class="card-body placeholder-text">Disponible a la fase 2</div>
    </section>

    <section class="panel recorders card" aria-label="Enregistradors">
      <div class="card-header"><i class="bi bi-record-circle"></i> Enregistradors</div>
      <div class="card-body placeholder-text">Disponible a la fase 2</div>
    </section>

    <section class="panel recents card" aria-label="Enregistraments recents">
      <div class="card-header"><i class="bi bi-clock-history"></i> Recents</div>
      <div class="card-body placeholder-text">Disponible a la fase 2</div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
