<!doctype html>
<html lang="ca" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src ws://127.0.0.1:*">
  <title>Ona Bages Play</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="../assets/logo.svg" alt=""> <span class="brand-text">Ona Bages Play</span></div>

    <div id="clock" class="clock" aria-label="Hora actual">--:--:--</div>

    <!-- Perfil actiu (fase 4): menú per canviar-lo, crear-ne, duplicar-lo, canviar-li el nom i eliminar-ne. -->
    <button id="btn-profile" class="btn btn-sm btn-outline-secondary profile-button" type="button" title="Perfil (configuració de treball del programa)">
      <i class="bi bi-person-badge"></i>
      <span class="profile-label">Perfil</span>
      <i class="bi bi-caret-down-fill"></i>
    </button>

    <!-- Nom del programa (⚙ Configuració; pas 10). Amagat si no n'hi ha o si és igual que el del perfil. -->
    <span id="program-name" class="program-name d-none" title="Programa (es canvia a ⚙ Configuració)"></span>

    <!-- Canvis de configuració que s'aplicaran en tornar a obrir l'aplicació (pas 9). -->
    <span id="restart-notice" class="restart-notice d-none" role="status">
      <i class="bi bi-arrow-repeat"></i>
      <span class="restart-long">Canvis pendents: tanca i torna a obrir l'aplicació</span>
      <span class="restart-short">Cal tornar a obrir</span>
    </span>

    <div class="engine">
      <span id="zoom-indicator" class="zoom-indicator"></span>
      <span id="engine-status" class="status status-connecting" role="status">
        <i class="bi bi-hourglass-split"></i>
        <span class="label">Connectant amb el motor…</span>
      </span>
      <span id="engine-details" class="details"></span>
      <button id="btn-editor" class="btn btn-sm btn-outline-secondary btn-settings" type="button" title="Obrir l'editor">
        <i class="bi bi-scissors"></i>
      </button>
      <button id="btn-settings" class="btn btn-sm btn-outline-secondary btn-settings" type="button" title="Configuració">
        <i class="bi bi-gear"></i>
      </button>
    </div>
  </header>

  <!-- Avís molt visible quan el motor no respon (especificació 4.5). -->
  <div id="engine-down" class="engine-down d-none" role="alert">
    <i class="bi bi-exclamation-octagon-fill"></i>
    <div class="engine-down-text">
      <strong>MOTOR NO DISPONIBLE</strong>
      <span id="engine-down-detail">El so i els enregistraments s'han aturat.</span>
    </div>
    <button id="btn-restart-engine" class="btn btn-light btn-lg" type="button">
      <i class="bi bi-arrow-repeat"></i> Reiniciar el motor
    </button>
  </div>

  <div class="workspace">
    <main class="layout">
      <div id="players" class="players" aria-label="Reproductors"></div>
      <div id="recorders" class="recorders" aria-label="Enregistradors"></div>
    </main>

    <!-- Panell lateral (fase 4, pas 2b; D-062): plegat per defecte. Quan s'obre, la finestra es fa més ampla
         (els reproductors no canvien de mida). La gestiona js/ui/side-panel.js. -->
    <aside id="side" class="side" aria-label="Panell lateral">
      <div class="side-content">
        <div class="side-tab" data-tab="audios">
          <!-- Explorador d'àudios: el crea js/ui/explorer-tab.js en connectar-se amb el motor. -->
          <section class="card panel side-placeholder">
            <div class="card-header panel-header"><span class="panel-title"><i class="bi bi-folder2-open"></i> Àudios</span></div>
            <div class="card-body placeholder-text">Connectant…</div>
          </section>
        </div>
        <div class="side-tab" data-tab="lists">
          <section class="card panel side-placeholder">
            <div class="card-header panel-header"><span class="panel-title"><i class="bi bi-collection-play"></i> Llistes</span></div>
            <div class="card-body placeholder-text">Connectant…</div>
          </section>
        </div>
        <div class="side-tab" data-tab="recents">
          <!-- Enregistraments recents: el crea js/ui/recents-panel.js en connectar-se amb el motor. -->
          <section id="recents" class="card panel recents" aria-label="Enregistraments recents">
            <div class="card-header panel-header"><span class="panel-title"><i class="bi bi-clock-history"></i> Recents</span></div>
            <div class="card-body placeholder-text">Connectant…</div>
          </section>
        </div>

        <!-- Preescolta: sempre a baix del panell obert. La crea js/ui/cue-panel.js en connectar-se amb el motor. -->
        <section id="cue" class="card panel cue" aria-label="Preescolta">
          <div class="card-header panel-header"><span class="panel-title"><i class="bi bi-headphones"></i> Preescolta</span></div>
          <div class="card-body placeholder-text">Connectant…</div>
        </section>
      </div>

      <!-- Franja d'icones (sempre visible). -->
      <nav class="side-strip" aria-label="Panells">
        <button type="button" class="side-btn" data-tab="audios" title="Àudios"><i class="bi bi-folder2-open"></i></button>
        <button type="button" class="side-btn" data-tab="lists" title="Llistes desades"><i class="bi bi-collection-play"></i></button>
        <button type="button" class="side-btn" data-tab="recents" title="Enregistraments recents"><i class="bi bi-clock-history"></i></button>
        <button type="button" class="side-btn side-btn-toggle" title="Obrir el panell"><i class="bi bi-chevron-double-left"></i></button>
      </nav>

      <!-- Per saber l'amplada del panell obert abans d'obrir-lo (no es veu). -->
      <div class="side-measure" aria-hidden="true"></div>
    </aside>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
